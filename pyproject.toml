[project]
name = "ai-bot"
version = "0.1.0"
description = "DevinX — autonomous AI software engineer bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
]

[tool.setuptools]
packages = ["app", "app.tools", "app.models"]

[project.scripts]
ai-bot = "app.main:run"
